[project]
name = "ai-projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek MR", email = "abhi4aiuse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain-anthropic>=1.7.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-tools>=0.1.34",
    "langgraph>=1.2.12",
    "pandas>=3.0.6",
    "psycopg>=3.3.6",
    "psycopg2>=2.9.13",
    "pydantic>=2.13.5",
]

[project.scripts]
ai-projects = "ai_projects:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
